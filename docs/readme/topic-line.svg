<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 150" width="504" height="150" fill="none" role="img" aria-labelledby="t d">
  <title id="t">Topic line</title>
  <desc id="d">lulu-brainstorm leads to lulu-bet, the product decision, then to lulu-approach, the technical decision, which delivers a ticket dependency graph.</desc>
  <defs>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="503" height="149" rx="16" fill="#fafbfc" stroke="#e3e6ec"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.2">
    <text x="192" y="36" fill="#2563eb">PRODUCT</text>
    <text x="360" y="36" fill="#475569">TECHNICAL</text>
  </g>

  <g stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M144 68H185"/>
    <path d="M312 68H353"/>
    <path d="M420 92V104"/>
  </g>
  <g fill="#64748b">
    <polygon points="185,63.5 192,68 185,72.5"/>
    <polygon points="353,63.5 360,68 353,72.5"/>
  </g>

  <g filter="url(#lift)" fill="#ffffff" stroke-width="1.5">
    <rect x="24" y="44" width="120" height="48" rx="8" stroke="#334155"/>
    <rect x="192" y="44" width="120" height="48" rx="8" stroke="#60a5fa"/>
    <rect x="360" y="44" width="120" height="48" rx="8" stroke="#94a3b8"/>
    <rect x="336" y="104" width="144" height="22" rx="11" stroke="#94a3b8"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#1d1d1f">
    <text x="36" y="65">lulu-brainstorm</text>
    <text x="204" y="65">lulu-bet</text>
    <text x="372" y="65">lulu-approach</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">
    <text x="36" y="81">Divergent thinking</text>
    <text x="204" y="81">Product decision</text>
    <text x="372" y="81">Technical decision</text>
    <text x="408" y="119" text-anchor="middle">Ticket dependency graph</text>
  </g>
</svg>
