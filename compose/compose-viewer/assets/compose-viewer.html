<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lulu-Design Viewer · Narrative Arc</title>
    <style>
      :root {
        --panel: #ffffff;
        --panel-muted: #f1f3f8;
        --ink: #172033;
        --muted: #64708a;
        --line: #dfe3ec;
        --blue: #2f6bff;
        --blue-soft: #eaf0ff;
        --green: #16835d;
        --green-soft: #e4f5ed;
        --amber: #aa6900;
        --amber-soft: #fff2d7;
        --violet: #5b4db8;
        --violet-soft: #efecff;
        --slate: #667085;
        --slate-soft: #eef0f4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 880px;
        color: var(--ink);
        background: var(--panel);
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button {
        font: inherit;
        cursor: pointer;
      }

      .shell {
        min-height: 100vh;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 18px 28px;
        color: #ffffff;
        background: #172033;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        color: #172033;
        background: #ffffff;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 800;
      }

      .topbar h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
      }

      .topbar-spacer {
        flex: 1;
      }

      .source-state {
        color: #c5cede;
        font-size: 13px;
      }

      .stale-badge {
        display: none;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--amber);
        color: #1a1200;
        font-size: 12px;
        font-weight: 700;
      }

      .stale-badge.is-on {
        display: inline-block;
      }

      .orphan-box {
        margin: 12px 28px 0;
        padding: 12px 14px;
        border: 1px solid #f0d59a;
        border-radius: 10px;
        background: var(--amber-soft);
        color: var(--ink);
        font-size: 13px;
      }

      .orphan-box[hidden] {
        display: none !important;
      }

      .orphan-ids {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }

      .orphan-ids code {
        padding: 2px 6px;
        border-radius: 6px;
        background: #fff;
        font-size: 12px;
      }

      .topic-toggle {
        padding: 8px 12px;
        color: #ffffff;
        border: 1px solid #53607a;
        border-radius: 8px;
        background: transparent;
        font-size: 13px;
      }

      .arc-panel {
        margin: 16px 28px 0;
        padding: 16px 20px 18px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        box-shadow: 0 4px 14px rgba(29, 41, 70, 0.04);
      }

      .arc-panel.is-collapsed {
        display: none;
      }

      .arc-panel-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .arc-panel-heading {
        display: flex;
        align-items: baseline;
        gap: 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }

      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .filter {
        padding: 5px 9px;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel-muted);
        font-size: 12px;
      }

      .filter.is-active {
        color: var(--blue);
        border-color: #b8cbff;
        background: var(--blue-soft);
      }

      .arc-tree {
        display: grid;
        gap: 8px;
        max-height: 42vh;
        overflow: auto;
      }

      .group-block {
        display: grid;
        gap: 4px;
      }

      .group-title {
        padding: 4px 2px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 720;
        letter-spacing: 0.02em;
        text-transform: none;
      }

      .leaf-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 12px;
        color: inherit;
        border: 1px solid transparent;
        border-radius: 9px;
        background: transparent;
        text-align: left;
      }

      .leaf-row:hover {
        background: var(--panel-muted);
      }

      .leaf-row.is-selected {
        border-color: #b8cbff;
        background: var(--blue-soft);
      }

      .leaf-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 600;
      }

      .mount-pill {
        padding: 3px 7px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 720;
      }

      .mount-pill.seed {
        color: var(--slate);
        background: var(--slate-soft);
      }

      .mount-pill.deepen {
        color: var(--amber);
        background: var(--amber-soft);
      }

      .mount-pill.add {
        color: var(--violet);
        background: var(--violet-soft);
      }

      .fact-count {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
      }

      .content {
        padding: 12px 28px 30px;
      }

      .detail-card {
        position: relative;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        box-shadow: 0 4px 14px rgba(29, 41, 70, 0.04);
        overflow: hidden;
      }

      .status-pill {
        position: absolute;
        top: 16px;
        right: 16px;
        padding: 7px 10px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 720;
        color: var(--green);
        background: var(--green-soft);
      }

      .description {
        padding: 14px 164px 8px 22px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }

      .detail-body {
        display: grid;
        gap: 14px;
        padding: 8px 22px 22px;
      }

      .section-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--ink);
        font-size: 13px;
        font-weight: 720;
      }

      .section-label span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 580;
      }

      .meta-list {
        display: grid;
        gap: 8px;
      }

      .meta-row {
        display: grid;
        grid-template-columns: 88px 1fr;
        gap: 10px;
        font-size: 13px;
        line-height: 1.5;
      }

      .meta-row dt {
        color: var(--muted);
      }

      .meta-row dd {
        margin: 0;
        color: var(--ink);
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        padding: 6px 9px;
        color: #3c4d70;
        border: 1px solid #d8e0ef;
        border-radius: 7px;
        background: #f8faff;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }

      button.chip {
        cursor: pointer;
      }

      button.chip:hover,
      button.chip.is-selected {
        color: var(--blue);
        border-color: #b8cbff;
        background: var(--blue-soft);
      }

      .chip.topic {
        color: var(--violet);
        border-color: #d7d0ff;
        background: var(--violet-soft);
        font-family: inherit;
      }

      .chip.muted {
        color: var(--muted);
        border-style: dashed;
        background: var(--panel-muted);
      }

      .fact-detail {
        display: grid;
        gap: 10px;
        margin-top: 10px;
        padding: 14px;
        border: 1px solid #d8e0ef;
        border-radius: 10px;
        background: #f8faff;
      }

      .fact-detail-heading {
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        font-weight: 750;
      }

      .fact-detail-text {
        margin: 0;
        color: #3c4d70;
        font-size: 13px;
        line-height: 1.6;
        white-space: pre-wrap;
      }

      .fact-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .fact-tag {
        padding: 4px 7px;
        color: var(--muted);
        border-radius: 5px;
        background: var(--panel-muted);
        font-size: 11px;
        font-weight: 650;
      }

      .mermaid-panel {
        display: grid;
        gap: 12px;
      }

      .mermaid-diagram {
        overflow: auto;
        padding: 16px;
        border: 1px solid #d8e0ef;
        border-radius: 9px;
        background: #ffffff;
      }

      .mermaid-diagram svg {
        display: block;
        max-width: none;
        height: auto;
      }

      .mermaid-error {
        color: #9d2f2f;
        font-size: 12px;
        line-height: 1.5;
      }

      .open-box {
        padding: 12px 14px;
        border: 1px dashed #d8e0ef;
        border-radius: 10px;
        background: #fafbff;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .empty {
        padding: 18px;
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 9px;
        background: var(--panel-muted);
        font-size: 13px;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">NA</div>
          <h1>Lulu-Design Viewer · Narrative Arc</h1>
        </div>
        <div class="topbar-spacer"></div>
        <span id="stale-badge" class="stale-badge" aria-live="polite">STALE · unattached facts</span>
        <span id="source-state" class="source-state">Loading collaboration arc…</span>
        <button id="toggle-arc" class="topic-toggle" type="button" aria-expanded="true">
          Hide arc
        </button>
      </header>

      <div id="orphan-box" class="orphan-box" hidden>
        <strong>Unattached facts</strong>
        <span id="orphan-count"></span>
        <div id="orphan-ids" class="orphan-ids"></div>
      </div>

      <main class="workspace">
        <section id="arc-panel" class="arc-panel">
          <div class="arc-panel-toolbar">
            <div class="arc-panel-heading">
              <span>Collaboration display arc</span>
              <span id="tree-count"></span>
            </div>
            <div class="filter-row">
              <button class="filter is-active" type="button" data-mount="all">All</button>
              <button class="filter" type="button" data-mount="seed">Seed</button>
              <button class="filter" type="button" data-mount="deepen">Deepen</button>
              <button class="filter" type="button" data-mount="regen">Regen</button>
              <button class="filter" type="button" data-mount="add">Add</button>
            </div>
          </div>
          <nav id="arc-tree" class="arc-tree" aria-label="Narrative arc"></nav>
        </section>

        <section class="content">
          <article class="detail-card">
            <span id="arc-status" class="status-pill">—</span>
            <div id="leaf-description" class="description"></div>
            <div class="detail-body">
              <div>
                <div class="section-label">
                  <strong>Leaf</strong>
                  <span>click a fact ID</span>
                </div>
                <dl id="leaf-meta" class="meta-list"></dl>
              </div>
              <div>
                <div class="section-label">
                  <strong>Fact IDs</strong>
                  <span id="fact-count"></span>
                </div>
                <div id="fact-chips" class="chip-row"></div>
                <div id="fact-detail" class="fact-detail" hidden>
                  <div id="fact-detail-heading" class="fact-detail-heading"></div>
                  <p id="fact-detail-text" class="fact-detail-text"></p>
                  <div id="fact-tags" class="fact-tags"></div>
                  <div id="mermaid-panel" class="mermaid-panel" hidden></div>
                </div>
              </div>
              <div id="open-section" hidden>
                <div class="section-label">
                  <strong>Open items</strong>
                  <span>no facts yet</span>
                </div>
                <div id="open-items" class="meta-list"></div>
              </div>
            </div>
          </article>
        </section>
      </main>
    </div>

    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "strict",
        theme: "base",
      });
      window.mermaidRenderer = mermaid;
      window.dispatchEvent(new Event("mermaid-ready"));
    </script>
    <script>
      const CONFIG_SOURCE = "./_compose-viewer.json";
      const FORMAL_BASENAME = "_narrative-arc.json";
      const DEFAULT_ARC = "./_narrative-arc.collab.json";
      const DEFAULT_FACTS = "./_facts.json";

      function isFormalArcSource(arc) {
        const raw = String(arc || "").trim().replace(/\\/g, "/");
        if (!raw) return false;
        const base = raw.split("/").pop();
        return base === FORMAL_BASENAME;
      }
      const POLL_MS = 1000;
      let mermaidRenderSequence = 0;

      const state = {
        arcSource: DEFAULT_ARC,
        factsSource: DEFAULT_FACTS,
        configReady: false,
        arc: null,
        factsById: new Map(),
        leafById: new Map(),
        orphanIds: [],
        selectedLeafId: null,
        selectedFactId: null,
        mountFilter: "all",
        arcVisible: true,
        lastPayload: "",
      };

      const els = {
        sourceState: document.getElementById("source-state"),
        staleBadge: document.getElementById("stale-badge"),
        orphanBox: document.getElementById("orphan-box"),
        orphanCount: document.getElementById("orphan-count"),
        orphanIds: document.getElementById("orphan-ids"),
        toggleArc: document.getElementById("toggle-arc"),
        arcPanel: document.getElementById("arc-panel"),
        treeCount: document.getElementById("tree-count"),
        arcTree: document.getElementById("arc-tree"),
        arcStatus: document.getElementById("arc-status"),
        leafDescription: document.getElementById("leaf-description"),
        leafMeta: document.getElementById("leaf-meta"),
        factCount: document.getElementById("fact-count"),
        factChips: document.getElementById("fact-chips"),
        factDetail: document.getElementById("fact-detail"),
        factDetailHeading: document.getElementById("fact-detail-heading"),
        factDetailText: document.getElementById("fact-detail-text"),
        factTags: document.getElementById("fact-tags"),
        mermaidPanel: document.getElementById("mermaid-panel"),
        openSection: document.getElementById("open-section"),
        openItems: document.getElementById("open-items"),
      };

      function computeOrphans(arc, facts) {
        const attached = new Set();
        for (const leaf of arc?.leaves || []) {
          for (const id of leaf?.fact_ids || []) attached.add(id);
        }
        return (facts || [])
          .map((f) => f?.id)
          .filter((id) => id && !attached.has(id));
      }

      function renderOrphans() {
        const orphans = state.orphanIds;
        const stale = orphans.length > 0;
        els.staleBadge.classList.toggle("is-on", stale);
        els.orphanBox.hidden = !stale;
        if (!stale) {
          els.orphanCount.textContent = "";
          els.orphanIds.innerHTML = "";
          return;
        }
        els.orphanCount.textContent = ` · ${orphans.length}`;
        els.orphanIds.innerHTML = orphans
          .map((id) => `<code>${escapeHtml(id)}</code>`)
          .join("");
      }

      async function ensureConfig() {
        if (state.configReady) return;
        try {
          const cfg = await fetchJson(CONFIG_SOURCE, Date.now());
          const arc = String(cfg.arc_source || DEFAULT_ARC).trim() || DEFAULT_ARC;
          if (isFormalArcSource(arc)) {
            throw new Error("Formal _narrative-arc.json hard-banned as viewer source");
          }
          state.arcSource = arc;
          state.factsSource = String(cfg.facts_source || DEFAULT_FACTS).trim() || DEFAULT_FACTS;
        } catch (err) {
          // Missing config → collab default (never Formal)
          state.arcSource = DEFAULT_ARC;
          state.factsSource = DEFAULT_FACTS;
          if (String(err.message || "").includes("hard-banned")) throw err;
        }
        state.configReady = true;
      }

      function mountOf(leafId) {
        return state.arc?.meta?.leaf_mounts?.[leafId] || "seed";
      }

      function indexLeaves(arc) {
        const map = new Map();
        for (const leaf of arc.leaves || []) {
          map.set(leaf.id, leaf);
        }
        return map;
      }

      function collectLeafNodes(node, out = []) {
        if (!node) return out;
        const children = node.children || [];
        if (!children.length && node.id && state.leafById.has(node.id)) {
          out.push(node);
          return out;
        }
        for (const child of children) collectLeafNodes(child, out);
        return out;
      }

      async function fetchJson(path, refreshToken) {
        const url = `${path}?refresh=${refreshToken}`;
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error(`${path} HTTP ${res.status}`);
        return res.json();
      }

      function indexFacts(facts) {
        const map = new Map();
        for (const fact of facts || []) {
          if (fact?.id) map.set(fact.id, fact);
        }
        return map;
      }

      function renderTree() {
        const arc = state.arc;
        if (!arc) return;
        const root = arc.tree;
        const groups = root?.children || [];
        const filter = state.mountFilter;
        let visibleLeaves = 0;

        const html = groups
          .map((group) => {
            const leaves = collectLeafNodes(group).filter((node) => {
              const mount = mountOf(node.id);
              return filter === "all" || mount === filter;
            });
            visibleLeaves += leaves.length;
            if (!leaves.length) return "";
            const rows = leaves
              .map((node) => {
                const leaf = state.leafById.get(node.id);
                const mount = mountOf(node.id);
                const selected = node.id === state.selectedLeafId ? " is-selected" : "";
                return `
                  <button class="leaf-row${selected}" type="button" data-leaf-id="${node.id}">
                    <span class="leaf-title">${escapeHtml(node.title || leaf?.title || node.id)}</span>
                    <span class="mount-pill ${mount}">${mount}</span>
                    <span class="fact-count">${(leaf?.fact_ids || []).length}</span>
                  </button>
                `;
              })
              .join("");
            return `
              <div class="group-block">
                <div class="group-title">${escapeHtml(group.title || group.id)}</div>
                ${rows}
              </div>
            `;
          })
          .join("");

        els.arcTree.innerHTML = html || `<div class="empty">No leaves for filter “${filter}”.</div>`;
        els.treeCount.textContent = `${visibleLeaves} leaves · ${arc.status}`;
      }

      function renderDetail() {
        const arc = state.arc;
        if (!arc) return;
        const leaf = state.leafById.get(state.selectedLeafId);
        els.arcStatus.textContent = arc.status || "—";

        if (!leaf) {
          els.leafDescription.textContent = arc.meta?.note || arc.tree?.title || "Select a leaf.";
          els.leafMeta.innerHTML = "";
          els.factChips.innerHTML = "";
          els.factCount.textContent = "";
          state.selectedFactId = null;
          renderFactDetail();
          renderOpenItems();
          return;
        }

        const mount = mountOf(leaf.id);
        const fids = leaf.fact_ids || [];
        if (state.selectedFactId && !fids.includes(state.selectedFactId)) {
          state.selectedFactId = null;
        }
        els.leafDescription.textContent = `${leaf.title} · mount=${mount}`;
        els.leafMeta.innerHTML = `
          <div class="meta-row"><dt>id</dt><dd><code>${escapeHtml(leaf.id)}</code></dd></div>
          <div class="meta-row"><dt>mount</dt><dd><span class="mount-pill ${mount}">${mount}</span></dd></div>
          <div class="meta-row"><dt>chapters</dt><dd>${(leaf.chapters || [])
            .map((c) => `<code>${escapeHtml(c.lens)}</code>`)
            .join(" · ") || "—"}</dd></div>
        `;
        els.factCount.textContent = `${fids.length} · click to view`;
        els.factChips.innerHTML = fids.length
          ? fids
              .map((id) => {
                const selected = id === state.selectedFactId ? " is-selected" : "";
                return `<button class="chip${selected}" type="button" data-fact-id="${escapeHtml(id)}">${escapeHtml(id)}</button>`;
              })
              .join("")
          : `<span class="chip muted">no facts</span>`;
        renderFactDetail();
        renderOpenItems(leaf.id);
      }

      function extractMermaidBlocks(text) {
        return [...String(text || "").matchAll(/```mermaid\s*\r?\n([\s\S]*?)```/g)].map(
          (match) => match[1].trim(),
        );
      }

      async function renderMermaidDiagrams(factId, diagrams) {
        els.mermaidPanel.replaceChildren();
        els.mermaidPanel.hidden = diagrams.length === 0;
        if (!diagrams.length) return;

        if (!window.mermaidRenderer) {
          const message = document.createElement("div");
          message.className = "mermaid-error";
          message.textContent = "Mermaid renderer is loading…";
          els.mermaidPanel.append(message);
          return;
        }

        for (const [index, definition] of diagrams.entries()) {
          const container = document.createElement("div");
          container.className = "mermaid-diagram";
          els.mermaidPanel.append(container);
          try {
            const id = `mermaid-${factId}-${index}-${mermaidRenderSequence++}`;
            const { svg, bindFunctions } = await window.mermaidRenderer.render(id, definition);
            if (state.selectedFactId !== factId) return;
            container.innerHTML = svg;
            bindFunctions?.(container);
          } catch (error) {
            const message = document.createElement("div");
            message.className = "mermaid-error";
            message.textContent = `Diagram could not be rendered: ${error.message}`;
            container.replaceChildren(message);
          }
        }
      }

      function renderFactDetail() {
        const factId = state.selectedFactId;
        els.mermaidPanel.replaceChildren();
        els.mermaidPanel.hidden = true;
        if (!factId) {
          els.factDetail.hidden = true;
          els.factDetailHeading.textContent = "";
          els.factDetailText.textContent = "";
          els.factDetailText.hidden = false;
          els.factTags.innerHTML = "";
          return;
        }
        const fact = state.factsById.get(factId);
        els.factDetail.hidden = false;
        if (!fact) {
          els.factDetailHeading.textContent = factId;
          els.factDetailText.hidden = false;
          els.factDetailText.textContent = "Fact not found in _facts.json";
          els.factTags.innerHTML = "";
          return;
        }
        const diagrams = extractMermaidBlocks(fact.text);
        const prose = String(fact.text || "")
          .replace(/```mermaid\s*\r?\n[\s\S]*?```/g, "")
          .trim();
        els.factDetailHeading.textContent = fact.id;
        els.factDetailText.textContent = prose;
        els.factDetailText.hidden = !prose;
        const tags = fact.lens_tags || [];
        els.factTags.innerHTML = tags.length
          ? tags.map((tag) => `<span class="fact-tag">${escapeHtml(tag)}</span>`).join("")
          : `<span class="fact-tag">no lens</span>`;
        renderMermaidDiagrams(fact.id, diagrams);
      }

      function renderOpenItems(selectedLeafId) {
        const opens = state.arc?.meta?.open_items || [];
        if (!opens.length) {
          els.openSection.hidden = true;
          els.openItems.innerHTML = "";
          return;
        }
        els.openSection.hidden = false;
        els.openItems.innerHTML = opens
          .map((item) => {
            const hint =
              selectedLeafId && item.suggested_leaf === selectedLeafId
                ? " · suggested for current leaf"
                : "";
            const leafHint = item.suggested_leaf
              ? `<br/><code>${escapeHtml(item.suggested_leaf)}</code>`
              : "";
            return `<div class="open-box"><strong>${escapeHtml(item.title || "Open item")}</strong>${hint}${leafHint}<br/>${escapeHtml(item.note || "")}</div>`;
          })
          .join("");
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function applyArc(arc, facts, { preserveSelection = true } = {}) {
        state.arc = arc;
        state.factsById = indexFacts(facts);
        state.leafById = indexLeaves(arc);
        const leafIds = [...state.leafById.keys()];
        if (!preserveSelection || !state.selectedLeafId || !state.leafById.has(state.selectedLeafId)) {
          state.selectedLeafId = leafIds[0] || null;
          state.selectedFactId = null;
        }
        renderTree();
        renderDetail();
      }

      async function refresh(silent = false) {
        try {
          await ensureConfig();
          const token = Date.now();
          const [arc, facts] = await Promise.all([
            fetchJson(state.arcSource, token),
            fetchJson(state.factsSource, token),
          ]);
          const payload = JSON.stringify({ arc, facts, src: state.arcSource });
          if (payload === state.lastPayload) {
            if (!silent) els.sourceState.textContent = "Collaboration arc unchanged";
            return;
          }
          state.lastPayload = payload;
          state.orphanIds = computeOrphans(arc, facts);
          applyArc(arc, facts, { preserveSelection: silent || !!state.selectedLeafId });
          renderOrphans();
          const kind = arc.kind || "arc";
          els.sourceState.textContent = `${kind} · ${state.arcSource} · facts ${state.factsById.size} · orphans ${state.orphanIds.length}`;
        } catch (err) {
          els.sourceState.textContent = `Load failed: ${err.message || err}`;
          els.staleBadge.classList.remove("is-on");
        }
      }

      els.toggleArc.addEventListener("click", () => {
        state.arcVisible = !state.arcVisible;
        els.arcPanel.classList.toggle("is-collapsed", !state.arcVisible);
        els.toggleArc.textContent = state.arcVisible ? "Hide arc" : "Show arc";
        els.toggleArc.setAttribute("aria-expanded", String(state.arcVisible));
      });

      document.querySelectorAll(".filter").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".filter").forEach((b) => b.classList.remove("is-active"));
          btn.classList.add("is-active");
          state.mountFilter = btn.dataset.mount;
          renderTree();
        });
      });

      els.arcTree.addEventListener("click", (event) => {
        const btn = event.target.closest("[data-leaf-id]");
        if (!btn) return;
        state.selectedLeafId = btn.dataset.leafId;
        state.selectedFactId = null;
        renderTree();
        renderDetail();
      });

      els.factChips.addEventListener("click", (event) => {
        const btn = event.target.closest("[data-fact-id]");
        if (!btn) return;
        const factId = btn.dataset.factId;
        state.selectedFactId = state.selectedFactId === factId ? null : factId;
        renderDetail();
      });

      window.addEventListener("mermaid-ready", () => {
        if (state.selectedFactId) renderFactDetail();
      });

      refresh(false);
      setInterval(() => refresh(true), POLL_MS);
    </script>
  </body>
</html>
